write_register:
  name: Write single register (FC06)
  description: Write one value to a holding register, always using FC06 (ignores the write_mode option). Deye inverters usually require write_registers (FC16) instead.
  fields:
    address:
      name: Address
      description: Holding register address (decimal, before any address offset).
      required: true
      selector:
        number: { min: 0, max: 65535, mode: box, step: 1 }
    value:
      name: Value
      description: Value to write (0-65535).
      required: true
      selector:
        number: { min: 0, max: 65535, mode: box, step: 1 }

write_registers:
  name: Write multiple registers (FC16)
  description: Write a list of 16-bit values starting at address.
  fields:
    address:
      name: Address
      required: true
      selector:
        number: { min: 0, max: 65535, step: 1, mode: box }
    values:
      name: Values
      required: true
      selector:
        object: {}

write_u32:
  name: Write 32-bit value (FC16)
  description: Write a 32-bit value into two consecutive registers.
  fields:
    address:
      name: Base address
      required: true
      selector:
        number: { min: 0, max: 65535, step: 1, mode: box }
    value:
      name: Value (0..4294967295)
      required: true
      selector:
        number: { min: 0, max: 4294967295, step: 1, mode: box }
    word_order:
      name: Word order
      selector:
        select:
          options:
            - high_low
            - low_high
      default: high_low
